<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <div class="login-div">
        <form class="form-div" action="mailto:dependra2021ito21@abesit.edu.in" method="post" enctype="text/plain">
            <h2 class="heading-div">Login</h2>
            <div class="username-div">
                <h4 class="username-heading">Username</h4>
                <input class="username" type="input" placeholder="Username" required>
            </div>

            <div class="password-div">
                <h4 class="password-heading">Password</h4>
                <input class="password" type="password" placeholder="Password" required>
            </div>

            <div class="forget-password-div">
                <h5 class="forget-password-heading">Forget Password?</h5>
            </div>

            <div class="btn-div">
                <input class="submit-btn" type="submit" value="Login">
            </div>

            <div class="not-member-div">
                Not a member?
                <a class="signup" href="#">Signup</a>
            </div>
        </form>
    </div>
</body>

</html>
